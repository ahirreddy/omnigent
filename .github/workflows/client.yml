name: Client

# Native Apple client: the Rust core (client-core/, built for Apple via UniFFI)
# and the Tuist-generated macOS/iOS apps (apps/apple/). Runs on every non-draft
# PR that touches either tree, and on push to main. Draft PRs are skipped;
# `ready_for_review` refires when the draft is converted.
#
# The macOS desktop app is the primary target: `rust` and `apple-macos` must
# pass. `apple-macos` builds and tests both Mac editions: OmnigentMac
# (Developer ID, embeds the CEF web host) and OmnigentMacAppStore (App Sandbox, WebKit
# only). `apple-ios` (simulator build + test) is non-blocking for now.
#
# None of these jobs are in the generated merge-ready REQUIRED list
# (.github/scripts/merge-ready/required.sh) yet.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "client-core/**"
      - "apps/apple/**"
      - ".github/workflows/client.yml"
      - ".github/workflows/security-gate.yml"
      - ".github/actions/setup-uv/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
  push:
    branches:
      - main
    paths:
      - "client-core/**"
      - "apps/apple/**"
      - ".github/workflows/client.yml"
      - ".github/workflows/security-gate.yml"
      - ".github/actions/setup-uv/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"

permissions:
  contents: read

concurrency:
  # PRs key by number (old runs cancel); push keys by SHA (each merge runs).
  group: client-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No web SPA build during `uv sync` (setup.py _build_web_ui); nothing here
  # serves the bundle.
  OMNIGENT_SKIP_WEB_UI: "true"

jobs:
  # Security precondition gate: these jobs build and run the PR's own code, so
  # untrusted PRs are held until the scan passes (security-gate.yml). Trusted
  # authors and non-PR events pass through.
  gate:
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read
      pull-requests: read

  rust:
    name: Client core (Rust)
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client-core
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # rustup (preinstalled on hosted runners) installs the channel, components
      # and targets pinned in client-core/rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: client-core -> target

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

      # Type-check only: the platform-neutral crates must stay wasm32-clean for
      # a future web/WASM build. There is no JS facade or wasm test yet.
      - name: wasm32 check (core crates)
        run: cargo check --locked -p omnigent-core -p omnigent-protocol --target wasm32-unknown-unknown

  apple-macos:
    name: Apple client (macOS)
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    # Xcode 27 ships on the `xcode-27` image (public preview), not macos-26.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The project requires Xcode 27.2 (Tuist compatibleXcodeVersions); the
      # image may only carry it under a release-candidate app name.
      - name: Select Xcode 27.2
        run: |
          app="$(find /Applications -maxdepth 1 -name 'Xcode_27.2*.app' | sort | head -1)"
          if [ -z "$app" ]; then
            echo "::error::Xcode 27.2 is not installed on this runner"
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install pinned Rust toolchain
        working-directory: client-core
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: client-core -> target

      # Installs the tuist and swiftlint versions pinned in apps/apple/.mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
        with:
          working_directory: apps/apple

      # Strict over the whole tree, packages included (config excludes
      # Reference/, Tools/, Vendor/ and generated bindings).
      - name: SwiftLint
        working-directory: apps/apple
        run: mise exec -- swiftlint lint --strict --config .swiftlint.yml

      - name: Build Rust core xcframework and Swift bindings
        run: bash apps/apple/scripts/build-core.sh debug

      # The cache key is the CEF version and archive checksum pinned in
      # fetch-cef.sh, so bumping either refetches. The runner is arm64.
      - name: Read pinned CEF version
        id: cef
        run: |
          script=apps/apple/scripts/fetch-cef.sh
          version="$(sed -n 's/^CEF_VERSION="\(.*\)"$/\1/p' "$script")"
          sha256="$(sed -n 's/^ *macosarm64) echo "\([0-9a-f]\{64\}\)" ;;$/\1/p' "$script")"
          if [ -z "$version" ] || [ -z "$sha256" ]; then
            echo "::error::could not read CEF_VERSION or the macosarm64 sha256 from $script"
            exit 1
          fi
          echo "key=cef-arm64-${version}-${sha256}" >> "$GITHUB_OUTPUT"

      - name: Cache CEF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/apple/Vendor/cef/out
          key: ${{ steps.cef.outputs.key }}

      # Verifies both checksums, builds libcef_dll_wrapper and stages
      # Vendor/cef/out; a matching stamp from the cache short-circuits it.
      - name: Fetch CEF
        run: bash apps/apple/scripts/fetch-cef.sh --arch arm64

      - name: Generate Xcode workspace
        working-directory: apps/apple
        run: |
          mise exec -- tuist install
          mise exec -- tuist generate --no-open

      - name: Build macOS app (Developer ID edition)
        run: >-
          xcodebuild build
          -workspace apps/apple/Omnigent.xcworkspace
          -scheme OmnigentMac
          -destination 'platform=macOS'
          -derivedDataPath apps/apple/build/DerivedData

      - name: Test macOS app (Developer ID edition)
        run: >-
          xcodebuild test
          -workspace apps/apple/Omnigent.xcworkspace
          -scheme OmnigentMac
          -destination 'platform=macOS'
          -derivedDataPath apps/apple/build/DerivedData

      - name: Build macOS app (Mac App Store edition)
        run: >-
          xcodebuild build
          -workspace apps/apple/Omnigent.xcworkspace
          -scheme OmnigentMacAppStore
          -destination 'platform=macOS'
          -derivedDataPath apps/apple/build/DerivedData

      - name: Test macOS app (Mac App Store edition)
        run: >-
          xcodebuild test
          -workspace apps/apple/Omnigent.xcworkspace
          -scheme OmnigentMacAppStore
          -destination 'platform=macOS'
          -derivedDataPath apps/apple/build/DerivedData

      - name: Test Swift packages
        run: |
          shopt -s nullglob
          for pkg in apps/apple/Packages/*/; do
            if [ -d "$pkg/Tests" ]; then
              echo "::group::swift test $pkg"
              swift test --package-path "$pkg"
              echo "::endgroup::"
            fi
          done

      # apps/apple/Tools scripts run against this checkout's .venv (httpx etc.).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --no-dev

      - name: Test local-services and streaming tools
        run: .venv/bin/python -m unittest discover -s apps/apple/Tools -p 'test_*.py'

  apple-ios:
    name: Apple client (iOS simulator)
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    # Non-blocking while macOS is the primary target.
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # See apple-macos: the project requires Xcode 27.2.
      - name: Select Xcode 27.2
        run: |
          app="$(find /Applications -maxdepth 1 -name 'Xcode_27.2*.app' | sort | head -1)"
          if [ -z "$app" ]; then
            echo "::error::Xcode 27.2 is not installed on this runner"
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install pinned Rust toolchain
        working-directory: client-core
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: client-core -> target

      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195  # v5.2.5
        with:
          working_directory: apps/apple

      # The workspace also contains the macOS target, so build every slice.
      - name: Build Rust core xcframework and Swift bindings
        run: bash apps/apple/scripts/build-core.sh debug

      - name: Generate Xcode workspace
        working-directory: apps/apple
        run: |
          mise exec -- tuist install
          mise exec -- tuist generate --no-open

      - name: Build iOS app
        run: >-
          xcodebuild build
          -workspace apps/apple/Omnigent.xcworkspace
          -scheme Omnigent
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro'
          -derivedDataPath apps/apple/build/DerivedData

      - name: Test iOS app
        run: >-
          xcodebuild test
          -workspace apps/apple/Omnigent.xcworkspace
          -scheme Omnigent
          -destination 'platform=iOS Simulator,name=iPhone 18 Pro'
          -derivedDataPath apps/apple/build/DerivedData
