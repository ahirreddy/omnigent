# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml (unmaintained) is a build-time dependency of askama_derive inside uniffi_bindgen; it never ships in the app. Drop when uniffi moves off it." },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Compatible with the repository's Apache-2.0 license. MPL-2.0 is uniffi (file-level copyleft;
# we do not modify its sources).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
    { crate = "syn@3.0.9", reason = "uniffi 0.32 macros and goblin's scroll_derive moved to syn 3; the rest of the ecosystem is on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
