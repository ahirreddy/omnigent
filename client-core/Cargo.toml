[workspace]
resolver = "3"
members = [
    "crates/omnigent-protocol",
    "crates/omnigent-core",
    "crates/omnigent-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
omnigent-protocol = { path = "crates/omnigent-protocol" }
omnigent-core = { path = "crates/omnigent-core" }
async-trait = "0.1.92"
base64 = "0.22.1"
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
sha2 = "0.10.9"
futures = { version = "0.3.34", default-features = false, features = ["std", "executor"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "=0.32.2"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
let_underscore_drop = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
let_underscore_must_use = "deny"
large_futures = "deny"
await_holding_lock = "deny"

[profile.release]
# Thin LTO across 16 codegen units: nearly fat LTO's speed at a fraction of the link time.
opt-level = 3
lto = "thin"
codegen-units = 16
# Kept at unwind: UniFFI wraps every FFI call in catch_unwind and surfaces a Rust panic to Swift as
# a thrown error; with panic = "abort" any panic would terminate the app instead.
panic = "unwind"
strip = "debuginfo"
