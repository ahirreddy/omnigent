<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>smoke</title>
<style>
  body { margin: 0; background: #ffffff; font: 16px sans-serif; }
  #block { position: absolute; left: 0; top: 0; width: 400px; height: 300px; background: #ff0000; }
  #button { position: absolute; left: 100px; top: 400px; width: 200px; height: 80px; font-size: 24px; }
  #field { position: absolute; left: 600px; top: 420px; width: 300px; height: 40px; font-size: 24px; }
  #confirm { position: absolute; left: 100px; top: 560px; width: 200px; height: 60px; font-size: 20px; }
  #popup { position: absolute; left: 600px; top: 560px; font-size: 20px; }
</style>
</head>
<body>
<div id="block"></div>
<button id="button">Change</button>
<input id="field" autocomplete="off">
<button id="confirm">Confirm</button>
<a id="popup" href="popup.html" target="_blank">Open popup</a>
<script>
  const block = document.getElementById("block");
  const field = document.getElementById("field");
  document.getElementById("button").addEventListener("click", () => {
    block.style.background = "#0000ff";
    document.title = "clicked";
  });
  field.addEventListener("input", () => { document.title = "typed:" + field.value; });
  document.getElementById("confirm").addEventListener("click", () => {
    document.title = "confirm:" + window.confirm("Proceed?");
  });
</script>
</body>
</html>
