# Strict SwiftLint for apps/apple. Layout and whitespace belong to swift-format (.swift-format);
# the rules disabled below are the ones that would fight it.
#
#   lint:    mise exec -- swiftlint lint --strict --config .swiftlint.yml
#   analyze: mise exec -- swiftlint analyze --strict --config .swiftlint.yml \
#              --compiler-log-path build/xcodebuild.log
# (run from apps/apple; analyze needs a clean `xcodebuild build` log, see README)

included:
  - Apps
  - Packages
  - Tests
  - Tuist
  - Project.swift
  - Tuist.swift

excluded:
  - Reference
  - Tools
  - Vendor
  - Derived
  - build
  - Tuist/.build
  - Tests/NativeLabUITests
  - Packages/OmnigentCoreFFI/Sources
  - Packages/*/.build
  - Packages/*/.swiftpm

disabled_rules:
  - trailing_comma
  - opening_brace
  - closing_brace
  - line_length
  - indentation_width
  - vertical_whitespace
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - statement_position
  - comma
  - colon
  - function_name_whitespace
  - return_arrow_whitespace
  - leading_whitespace
  - trailing_whitespace
  - void_return

opt_in_rules:
  # Safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - discouraged_assert
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate
  - strong_iboutlet
  - private_action
  - private_outlet
  - private_swiftui_state
  - lower_acl_than_parent
  - overridden_super_call
  - prohibited_super_call
  - identical_operands
  - unavailable_function
  - legacy_random
  - legacy_multiple
  - legacy_objc_type
  - nslocalizedstring_key
  - optional_enum_case_matching
  - self_binding
  - shorthand_optional_binding
  - static_operator
  - yoda_condition
  - async_without_await
  # Idioms and performance
  - explicit_init
  - first_where
  - last_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_count
  - empty_string
  - empty_collection_literal
  - sorted_first_last
  - reduce_into
  - flatmap_over_map_reduce
  - joined_default_parameter
  - toggle_bool
  - redundant_nil_coalescing
  - redundant_type_annotation
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - convenience_type
  - return_value_from_void_function
  - non_overridable_class_declaration
  # Accessibility
  - accessibility_label_for_image
  - accessibility_trait_for_button
  # Tests
  - balanced_xctest_lifecycle
  - final_test_case
  - test_case_accessibility
  - xct_specific_matcher

analyzer_rules:
  - unused_import
  - unused_declaration

type_name:
  excluded: [ID]

identifier_name:
  excluded: [id, ok, to]
